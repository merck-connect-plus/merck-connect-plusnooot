    function PharmacistPortal({

    }) {
      // Pharmacist-only authentication state. Internal portals remain directly accessible.
      const [authState, setAuthState] = useState('unauthenticated'); // unauthenticated, signup, under_review, authenticated
      const [emailInput, setEmailInput] = useState('demo@elnour-pharmacy.com');
      const [passInput, setPassInput] = useState('Demo1234');
      const [accountPassword, setAccountPassword] = useState('Demo1234');
      const [authError, setAuthError] = useState('');
      const [signupError, setSignupError] = useState('');
      const [showTerms, setShowTerms] = useState(null);
      const [miniProfile, setMiniProfile] = useState(null);

      const [activeTab, setActiveTab] = useState('home');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedDrug, setSelectedDrug] = useState(null);

      // Verified profile used by the demo account and by the distributor request flow.
      const [pharmacistProfile, setPharmacistProfile] = useState({
        fullName: 'Dr. Eman Hassan',
        email: 'demo@elnour-pharmacy.com',
        mobile: '+20 100 555 0148',
        pharmacyName: 'El-Nour Pharmacy',
        pharmacyAddress: '18 Tahrir Street, Dokki, Giza, Egypt',
        taxNumber: 'EG-TAX-441982',
        licenseNumber: 'PH-LIC-774201',
        syndicateNumber: 'SYND-208841',
        verified: true
      });

      // Exactly four distributor relationships. Ordering is allowed only for Active links.
      const [distributorLinks, setDistributorLinks] = useState({
        'po': 'Pending',
        'is': 'Active',
        'em': 'Active',
        'mp': 'Not linked'
      });
      const [distributorCodes, setDistributorCodes] = useState({
        'is': 'IS-7734',
        'em': 'EM-2291'
      });

      const [relationshipModal, setRelationshipModal] = useState(null);
      const [codeInput, setCodeInput] = useState('');
      const [requestSubmitted, setRequestSubmitted] = useState(false);

      const [signup, setSignup] = useState({
        fullName: '', email: '', mobile: '', password: '', confirmPassword: '',
        pharmacyName: '', pharmacyAddress: '', taxNumber: '', licenseNumber: '', syndicateNumber: '',
        taxFile: null, licenseFile: null, terms: false, privacy: false
      });

      const passwordRules = {
        length: signup.password.length >= 8,
        capital: /[A-Z]/.test(signup.password),
        number: /\d/.test(signup.password)
      };
      const passwordValid = passwordRules.length && passwordRules.capital && passwordRules.number;
      const passwordsMatch = signup.password === signup.confirmPassword && signup.confirmPassword.length > 0;

      const updateSignup = (field, value) => setSignup(prev => ({ ...prev, [field]: value }));

      const handleSignup = (e) => {
        e.preventDefault();
        setSignupError('');
        if (!passwordValid || !passwordsMatch || !signup.taxFile || !signup.licenseFile || !signup.terms || !signup.privacy) {
          setSignupError('Please complete all required fields, document uploads, password requirements, and both policy acknowledgements.');
          return;
        }
        setPharmacistProfile({
          fullName: signup.fullName, email: signup.email, mobile: signup.mobile,
          pharmacyName: signup.pharmacyName, pharmacyAddress: signup.pharmacyAddress,
          taxNumber: signup.taxNumber, licenseNumber: signup.licenseNumber,
          syndicateNumber: signup.syndicateNumber, verified: false
        });
        setEmailInput(signup.email);
        setAccountPassword(signup.password);
        setPassInput('');
        setAuthState('under_review');
      };

      const handleLogin = (e) => {
        e.preventDefault();
        setAuthError('');
        // Seeded verified demo account.
        if (emailInput === 'demo@elnour-pharmacy.com' && passInput === 'Demo1234') {
          setPharmacistProfile(prev => ({ ...prev, verified: true, pharmacyName: 'El-Nour Pharmacy' }));
          setDistributorLinks({ po: 'Pending', is: 'Active', em: 'Active', mp: 'Not linked' });
          setDistributorCodes({ is: 'IS-7734', em: 'EM-2291' });
          setActiveTab('home');
          setAuthState('authenticated');
          return;
        }
        // Seeded unverified demo account: silent redirect to review, no error.
        if (emailInput === 'pending@newpharmacy.com' && passInput === 'Demo1234') {
          setAuthState('under_review');
          return;
        }
        if (emailInput === pharmacistProfile.email && !pharmacistProfile.verified && passInput === accountPassword) {
          setAuthState('under_review');
          return;
        }
        setAuthError('Email or password is incorrect');
      };

      const submitExistingCode = (distId) => {
        if (!codeInput.trim()) return;
        setDistributorLinks(prev => ({ ...prev, [distId]: 'Pending' }));
        setDistributorCodes(prev => ({ ...prev, [distId]: codeInput.trim() }));
        setCodeInput('');
        setRelationshipModal(null);
      };

      const requestNewCode = (distId) => {
        setDistributorLinks(prev => ({ ...prev, [distId]: 'Pending' }));
        setRequestSubmitted(true);
        setRelationshipModal({ type: 'requestSubmitted', distId });
      };

      const relationshipOrderData = {
        em: [
          { id: 'ORD-9052', product: 'Concor 5mg', qty: 10, total: 480, status: 'Delivered', date: '2026-09-05' },
          { id: 'ORD-8991', product: 'Glucophage 1000mg', qty: 20, total: 1200, status: 'Delivered', date: '2026-08-27' }
        ],
        is: [
          { id: 'ORD-9070', product: 'Glucophage 1000mg', qty: 15, total: 900, status: 'Out for Delivery', date: '2026-09-11' },
          { id: 'ORD-8912', product: 'Gonal-f 300 IU', qty: 4, total: 7400, status: 'Delivered', date: '2026-08-22' }
        ]
      };

      if (authState === 'signup') {
        return (
          <div className="max-w-3xl mx-auto py-8">
            <div className="border border-gray-200 rounded-merck p-7 bg-white">
              <div className="mb-6">
                <span className="text-xs font-bold uppercase tracking-wider text-merckMagenta">Pharmacist Portal</span>
                <h2 className="font-display text-3xl text-merckPurple mt-1">Create Pharmacist Account</h2>
                <p className="text-xs text-black mt-2">Submit your pharmacy credentials for verification. Distributor codes are collected only after approval.</p>
              </div>
              {signupError && <div className="bg-statusRed/10 border border-statusRed text-statusRed text-xs p-3 rounded-merck mb-5 font-semibold">{signupError}</div>}
              <form onSubmit={handleSignup} className="space-y-6">
                <div className="grid md:grid-cols-2 gap-4">
                  {[
                    ['fullName','Full Name','text'], ['email','Email Address (Login Username)','email'], ['mobile','Mobile Number','tel'],
                    ['pharmacyName','Pharmacy Name','text'], ['pharmacyAddress','Pharmacy Physical Address','text'],
                    ['taxNumber','Tax Registration Certificate Number','text'], ['licenseNumber','Pharmacy License Number','text'],
                    ['syndicateNumber','Pharmacist Syndicate Registration Number','text']
                  ].map(([field,label,type]) => (
                    <div key={field} className={field === 'pharmacyAddress' ? 'md:col-span-2' : ''}>
                      <label className="block text-xs font-bold uppercase tracking-wider mb-1">{label}</label>
                      <input type={type} value={signup[field]} onChange={e=>updateSignup(field,e.target.value)} className="w-full border border-gray-300 rounded-merck px-3 py-2.5 text-sm focus:outline-none focus:border-merckMagenta" required />
                    </div>
                  ))}
                </div>

                <div className="grid md:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider mb-1">Password</label>
                    <input type="password" value={signup.password} onChange={e=>updateSignup('password',e.target.value)} className="w-full border border-gray-300 rounded-merck px-3 py-2.5 text-sm" required />
                    <div className="mt-2 space-y-1 text-[11px]">
                      <div className={passwordRules.length ? 'text-statusGreen' : 'text-black'}>{passwordRules.length ? '✓' : '○'} 8+ characters</div>
                      <div className={passwordRules.capital ? 'text-statusGreen' : 'text-black'}>{passwordRules.capital ? '✓' : '○'} 1 capital letter</div>
                      <div className={passwordRules.number ? 'text-statusGreen' : 'text-black'}>{passwordRules.number ? '✓' : '○'} 1 number</div>
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider mb-1">Confirm Password</label>
                    <input type="password" value={signup.confirmPassword} onChange={e=>updateSignup('confirmPassword',e.target.value)} className={`w-full border rounded-merck px-3 py-2.5 text-sm ${signup.confirmPassword && !passwordsMatch ? 'border-statusRed' : 'border-gray-300'}`} required />
                    {signup.confirmPassword && <p className={`text-[11px] mt-1 font-semibold ${passwordsMatch ? 'text-statusGreen' : 'text-statusRed'}`}>{passwordsMatch ? 'Passwords match' : 'Passwords do not match'}</p>}
                  </div>
                </div>

                <div className="border-t border-gray-100 pt-5">
                  <h3 className="font-bold text-sm text-merckPurple mb-3">Required Verification Documents</h3>
                  <div className="grid md:grid-cols-2 gap-4">
                    {[
                      ['taxFile','Tax Registration Certificate'], ['licenseFile','Pharmacy License']
                    ].map(([field,label]) => (
                      <div key={field} className="border border-gray-200 rounded-merck p-4">
                        <label className="block text-xs font-bold uppercase tracking-wider mb-1">{label}</label>
                        <p className="text-[11px] text-statusRed font-bold mb-2">Required for activation</p>
                        <input type="file" accept="image/*,.pdf,application/pdf" onChange={e=>updateSignup(field,e.target.files?.[0] || null)} className="w-full text-xs" required />

                      </div>
                    ))}
                  </div>
                </div>

                <div className="border-t border-gray-100 pt-5 space-y-3">
                  <label className="flex items-start gap-2 text-xs"><input type="checkbox" checked={signup.terms} onChange={e=>updateSignup('terms',e.target.checked)} className="mt-0.5" required /><span>I agree to the <button type="button" onClick={()=>setShowTerms('terms')} className="text-merckMagenta font-bold underline">Terms & Conditions</button>.</span></label>
                  <label className="flex items-start gap-2 text-xs"><input type="checkbox" checked={signup.privacy} onChange={e=>updateSignup('privacy',e.target.checked)} className="mt-0.5" required /><span>I agree to the <button type="button" onClick={()=>setShowTerms('privacy')} className="text-merckMagenta font-bold underline">Privacy Policy</button>.</span></label>
                </div>

                <div className="flex gap-3 pt-2">
                  <button type="button" onClick={()=>setAuthState('unauthenticated')} className="w-1/2 border border-gray-300 font-bold py-2.5 rounded-merck text-xs uppercase">Back to Login</button>
                  <button type="submit" className="w-1/2 bg-merckMagenta text-white font-bold py-2.5 rounded-merck text-xs uppercase tracking-wider">Submit for Verification</button>
                </div>
              </form>
            </div>
            {showTerms && <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4"><div className="bg-white rounded-merck max-w-lg w-full p-6"><h3 className="font-display text-xl text-merckPurple mb-3">{showTerms === 'terms' ? 'Terms & Conditions' : 'Privacy Policy'}</h3><p className="text-xs leading-relaxed text-black mb-5">Prototype policy text. This panel demonstrates that the policy is accessible before submission. In production, the full approved document would be displayed here.</p><button onClick={()=>setShowTerms(null)} className="bg-merckPurple text-white px-5 py-2 rounded-merck text-xs font-bold uppercase">Close</button></div></div>}
          </div>
        );
      }

      if (authState === 'unauthenticated') {
        return (
          <div className="max-w-md mx-auto py-12">
            <div className="border border-gray-200 rounded-merck p-8 bg-white">
              <h2 className="font-display text-2xl text-merckPurple mb-2">Pharmacist Login</h2>
              <p className="text-xs text-black mb-6">Sign in to search the medication catalog, place orders, and manage distributor relationships.</p>
              {authError && <div className="bg-statusRed/10 border border-statusRed text-statusRed text-xs p-3 rounded-merck mb-4 font-semibold">{authError}</div>}
              <form onSubmit={handleLogin} className="space-y-4">
                <div><label className="block text-xs font-bold uppercase tracking-wider mb-1">Email</label><input type="email" value={emailInput} onChange={e=>setEmailInput(e.target.value)} className="w-full border border-gray-300 rounded-merck px-3 py-2.5 text-sm" required /></div>
                <div><label className="block text-xs font-bold uppercase tracking-wider mb-1">Password</label><input type="password" value={passInput} onChange={e=>setPassInput(e.target.value)} className="w-full border border-gray-300 rounded-merck px-3 py-2.5 text-sm" required /></div>

              </form>

                <p className="font-bold mb-1 text-merckPurple">Prototype demo credentials</p>
                <p>Verified: <strong>demo@elnour-pharmacy.com</strong> / <strong>Demo1234</strong></p>
                <p>Unverified: <strong>pending@newpharmacy.com</strong> / <strong>Demo1234</strong></p>
              </div>
            </div>
          </div>

      }

      if (authState === 'under_review') {
        return (
          <div className="max-w-lg mx-auto py-12">
            <div className="border border-gray-200 rounded-merck p-8 bg-white text-center">
              <div className="w-16 h-16 bg-statusAmber/10 text-statusAmber rounded-full flex items-center justify-center mx-auto mb-4"><i data-lucide="clock" className="w-8 h-8"></i></div>
              <h2 className="font-display text-2xl text-merckPurple mb-3">Account Under Review</h2>
              <p className="text-sm text-black leading-relaxed mb-4">Your account is pending verification. We are checking the uploaded <strong>tax registration certificate</strong> and <strong>pharmacy license</strong> against the information submitted in your application.</p>
              <div className="bg-merckTeal/10 border border-merckTeal rounded-merck p-4 text-xs text-black mb-5 text-left"><strong>Expected turnaround:</strong> up to 2 working days.<br/><br/><strong>Notification:</strong> you will be notified by email or SMS once your account is approved.</div>
              <p className="text-xs text-black mb-6">There is no further action required while verification is in progress. If you need assistance, please contact support.</p>
              <button onClick={()=>setAuthState('unauthenticated')} className="border border-merckPurple text-merckPurple font-bold px-6 py-2.5 rounded-merck text-xs uppercase">Back to Login</button>
            </div>
          </div>
        );
      }

      return (
        <div>
          <div className="flex border-b border-gray-200 mb-6 overflow-x-auto">
            {[
              ['home','Home (Search & Order)'],['distributors','My Distributors'],['history','Order History & Tracking'],['returns','Returns'],['chat','Chat with Med Rep']
            ].map(([tab,label]) => <button key={tab} onClick={()=>setActiveTab(tab)} className={`px-4 py-3 text-xs font-bold uppercase tracking-wider border-b-2 whitespace-nowrap ${activeTab===tab?'border-merckMagenta text-merckMagenta':'border-transparent text-black hover:text-merckPurple'}`}>{label}</button>)}
            <button onClick={onLogout} className="px-4 py-3 text-xs font-bold uppercase tracking-wider text-statusRed hover:underline ml-auto rtl:mr-auto rtl:ml-0">Log Out</button>
          </div>

          {activeTab === 'home' && (
            <div className="space-y-6">
              <div className="relative"><input type="text" placeholder="Search medication by name or therapeutic area (e.g., Bavencio, Concor, Glucophage)..." value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} className="w-full border-2 border-merckTeal rounded-merck px-4 py-3 pl-11 text-base focus:outline-none focus:border-merckMagenta" /><i data-lucide="search" className="w-5 h-5 text-merckPurple absolute left-4 top-3.5 rtl:right-4 rtl:left-auto"></i></div>
              <AnnouncementsCarousel announcements={announcements} />
              <div><h3 className="font-display text-xl text-merckPurple mb-4">Medication Catalog & Availability</h3><div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {SEEDED_PRODUCTS.filter(p=>p.name.toLowerCase().includes(searchQuery.toLowerCase())||p.line.toLowerCase().includes(searchQuery.toLowerCase())).map(product=><div key={product.id} className="border border-gray-200 rounded-merck p-4 bg-white hover:border-merckMagenta transition-all flex flex-col justify-between"><div><div className="flex justify-between items-start mb-2"><span className="text-xs bg-merckPurple/10 text-merckPurple px-2.5 py-0.5 rounded-full font-bold">{product.line}</span><span className={`text-xs px-2 py-0.5 rounded-full font-bold uppercase ${product.status==='In Stock'?'bg-statusGreen/10 text-statusGreen':'bg-statusAmber/10 text-statusAmber'}`}>{product.status}</span></div><h4 className="font-bold text-lg text-black mb-1">{product.name}</h4><p className="text-xs text-black mb-2">Form: {product.form}</p><p className="text-sm font-bold text-merckPurple mb-4">Locked Regulatory Price: EGP {product.price.toLocaleString()}</p></div><button onClick={()=>setSelectedDrug(product)} className="w-full bg-merckMagenta text-white font-bold py-2 rounded-merck text-xs uppercase tracking-wider">Select Product</button></div>)}
              </div></div>
              {selectedDrug && <OrderModal drug={selectedDrug} onClose={()=>setSelectedDrug(null)} distributorLinks={distributorLinks} skuLimits={skuLimits} productAuths={productAuths} onAddOrder={newOrd=>{setOrders([newOrd,...orders]);setSelectedDrug(null);setActiveTab('history')}} setPatientEnrollments={setPatientEnrollments} />}
            </div>
          )}

          {activeTab === 'distributors' && (
            <div className="space-y-6">
              <div><h3 className="font-display text-xl text-merckPurple">My Distributors</h3><p className="text-xs text-black mt-1">Manage your commercial relationships. Only Active relationships can be used for medication orders.</p></div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {DISTRIBUTORS_LIST.map(dist=>{
                  const status=distributorLinks[dist.id]||'Not linked';
                  return <div key={dist.id} className="border border-gray-200 rounded-merck p-5 bg-white"><div className="flex justify-between items-start gap-4"><div><h4 className="font-bold text-base text-black">{dist.name}</h4><p className="text-xs text-black mt-1">Branches: {dist.branches.join(', ')}</p><div className="mt-3 flex items-center gap-2"><span className="text-xs font-bold">Relationship:</span><span className={`text-xs px-2.5 py-1 rounded-full font-bold uppercase ${status==='Active'?'bg-statusGreen/10 text-statusGreen':status==='Pending'?'bg-statusAmber/10 text-statusAmber':'bg-gray-100 text-black'}`}>{status}</span></div>{status==='Pending'&&<p className="text-[11px] text-black mt-2">Your code or document request is being checked by the distributor. They will confirm the relationship directly.</p>}{status==='Active'&&<p className="text-[11px] text-black mt-2">Account number: <strong>{distributorCodes[dist.id]||'Active account'}</strong></p>}</div><div className="flex flex-col gap-2 items-end">
                    {status==='Not linked'&&<><button onClick={()=>{setRelationshipModal({type:'code',distId:dist.id});setCodeInput('')}} className="bg-merckMagenta text-white font-bold px-3 py-2 rounded-merck text-[11px] uppercase">Submit existing account code</button><button onClick={()=>{setRequestSubmitted(false);setRelationshipModal({type:'new',distId:dist.id})}} className="border border-merckMagenta text-merckMagenta font-bold px-3 py-2 rounded-merck text-[11px] uppercase">Request a new code</button></>}
                    {status==='Active'&&<button onClick={()=>setMiniProfile(dist.id)} className="border border-merckPurple text-merckPurple font-bold px-3 py-2 rounded-merck text-[11px] uppercase">Open mini-profile</button>}
                    {status==='Pending'&&<span className="text-[11px] text-statusAmber font-bold uppercase">Verification in progress</span>}
                  </div></div></div>;
                })}
              </div>

              {relationshipModal && relationshipModal.type==='code' && <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4"><div className="bg-white rounded-merck max-w-md w-full p-6"><h3 className="font-display text-xl text-merckPurple mb-2">Submit Existing Account Code</h3><p className="text-xs text-black mb-4">Enter the account/code number already issued by {DISTRIBUTORS_LIST.find(d=>d.id===relationshipModal.distId)?.name}.</p><input autoFocus value={codeInput} onChange={e=>setCodeInput(e.target.value)} className="w-full border border-gray-300 rounded-merck p-2.5 text-sm mb-4" placeholder="Account code" /><div className="flex gap-3"><button onClick={()=>setRelationshipModal(null)} className="w-1/2 border border-gray-300 py-2 rounded-merck text-xs font-bold">Cancel</button><button onClick={()=>submitExistingCode(relationshipModal.distId)} className="w-1/2 bg-merckMagenta text-white py-2 rounded-merck text-xs font-bold">Submit</button></div></div></div>}
              {relationshipModal && relationshipModal.type==='new' && <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4"><div className="bg-white rounded-merck max-w-md w-full p-6"><h3 className="font-display text-xl text-merckPurple mb-2">Request a New Code</h3><p className="text-xs text-black leading-relaxed mb-4">Your already-approved legal documents will be sent to {DISTRIBUTORS_LIST.find(d=>d.id===relationshipModal.distId)?.name}. Your verified profile supplies the tax certificate number, pharmacy license number, and syndicate registration number.</p><div className="bg-gray-50 rounded-merck p-3 text-[11px] space-y-1 mb-4"><div>Tax certificate: <strong>{pharmacistProfile.taxNumber}</strong></div><div>Pharmacy license: <strong>{pharmacistProfile.licenseNumber}</strong></div><div>Syndicate registration: <strong>{pharmacistProfile.syndicateNumber}</strong></div></div><div className="flex gap-3"><button onClick={()=>setRelationshipModal(null)} className="w-1/2 border border-gray-300 py-2 rounded-merck text-xs font-bold">Cancel</button><button onClick={()=>requestNewCode(relationshipModal.distId)} className="w-1/2 bg-merckMagenta text-white py-2 rounded-merck text-xs font-bold">Send Request</button></div></div></div>}
              {relationshipModal && relationshipModal.type==='requestSubmitted' && <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4"><div className="bg-white rounded-merck max-w-md w-full p-6 text-center"><div className="w-12 h-12 bg-statusAmber/10 text-statusAmber rounded-full flex items-center justify-center mx-auto mb-3"><i data-lucide="clock" className="w-6 h-6"></i></div><h3 className="font-display text-xl text-merckPurple mb-2">Request Submitted</h3><p className="text-xs text-black mb-5">The distributor is reviewing your legal documents and will follow up directly. Your relationship is now <strong>Pending</strong>.</p><button onClick={()=>setRelationshipModal(null)} className="bg-merckPurple text-white px-5 py-2 rounded-merck text-xs font-bold">Close</button></div></div>}
              {miniProfile && <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4"><div className="bg-white rounded-merck max-w-2xl w-full p-6 max-h-[85vh] overflow-y-auto"><div className="flex justify-between items-start mb-5"><div><span className="text-xs font-bold uppercase text-merckMagenta">Active Distributor Account</span><h3 className="font-display text-2xl text-merckPurple">{DISTRIBUTORS_LIST.find(d=>d.id===miniProfile)?.name}</h3><p className="text-xs text-black">Account number: <strong>{distributorCodes[miniProfile]}</strong></p></div><button onClick={()=>setMiniProfile(null)} className="text-xl font-bold">×</button></div><h4 className="font-bold text-sm text-merckPurple mb-3">Past Orders</h4><div className="space-y-2">{relationshipOrderData[miniProfile]?.map(o=><div key={o.id} className="border border-gray-200 rounded-merck p-3 flex justify-between items-center"><div><strong className="text-xs">{o.id}</strong><div className="text-xs">{o.product} · {o.qty} units · EGP {o.total.toLocaleString()}</div><div className="text-[11px] text-black">{o.date}</div></div><span className={`text-[11px] font-bold uppercase px-2 py-1 rounded-full ${o.status==='Delivered'?'bg-statusGreen/10 text-statusGreen':'bg-merckTeal/10 text-merckPurple'}`}>{o.status}</span></div>)}</div><div className="mt-5 border-t border-gray-100 pt-4"><h4 className="font-bold text-sm text-merckPurple mb-2">Account Features</h4><div className="grid sm:grid-cols-2 gap-2 text-xs"><div className="border border-gray-200 rounded-merck p-3">Statement of Account<br/><strong>Current balance: EGP 8,420</strong></div><div className="border border-gray-200 rounded-merck p-3">Delivery preference<br/><strong>Standard branch delivery</strong></div></div></div></div></div>}
            </div>
          )}

          {activeTab === 'history' && <PharmacistOrderHistory orders={orders.filter(o=>['Ibn Sina','El Masrya'].includes(o.distributor)||o.pharmacy==='El-Nour Pharmacy')} setOrders={setOrders} />}
          {activeTab === 'returns' && <PharmacistReturns returns={returns} setReturns={setReturns} orders={orders} />}
          {activeTab === 'chat' && <MedicalRepChat />}
        </div>
      );
    }

    // --- ANNOUNCEMENTS CAROUSEL (Section 2.3) ---
    function AnnouncementsCarousel({ announcements }) {
      const [currentIndex, setCurrentIndex] = useState(0);

      useEffect(() => {
        const timer = setInterval(() => {
          setCurrentIndex((prev) => (prev + 1) % announcements.length);
        }, 5000);
        return () => clearInterval(timer);
      }, [announcements.length]);

      const slide = announcements[currentIndex];

      return (
        <div className="relative rounded-merck overflow-hidden shadow-md text-white min-h-[180px]">
          <div className={`w-full h-full p-6 bg-gradient-to-r ${slide.bg} transition-all duration-700 ease-in-out flex flex-col justify-between`}>
            <div>
              <span className="inline-block bg-white/20 text-white text-xs px-3 py-1 rounded-full font-bold uppercase tracking-wider mb-2 border border-white/30">
                {slide.tag}
              </span>
              <h3 className="font-display text-2xl font-bold mb-2">{slide.title}</h3>
            </div>
            <div className="bg-white/95 text-black p-3.5 rounded-merck max-w-2xl text-xs font-medium">
              {slide.body}
            </div>
          </div>

          {/* Carousel Controls */}
          <div className="absolute bottom-4 right-4 rtl:left-4 rtl:right-auto flex items-center space-x-2 rtl:space-x-reverse">
            {announcements.map((_, idx) => (
              <button
                key={idx}
                onClick={() => setCurrentIndex(idx)}
                className={`w-2.5 h-2.5 rounded-full transition-all ${idx === currentIndex ? 'bg-white w-6' : 'bg-white/50'}`}
              />
            ))}
          </div>
        </div>
      );
    }

    // --- PHARMACIST ORDER MODAL (Section 2.4) ---
    function OrderModal({ drug, onClose, distributorLinks, skuLimits, productAuths, onAddOrder, setPatientEnrollments }) {
      const [distributor, setDistributor] = useState('');
      const [qty, setQty] = useState(1);
      const [isClinicalUrgent, setIsClinicalUrgent] = useState(false);
      const [urgentReason, setUrgentReason] = useState('Scheduled treatment date');
      const [isExpedited, setIsExpedited] = useState(false);
      const [paymentMethod, setPaymentMethod] = useState('Pay Online Now');

      // Patient Enrollment fields for Erbitux
      const [patientName, setPatientName] = useState('');
      const [patientId, setPatientId] = useState('');
      const [hospitalName, setHospitalName] = useState('');

      const isErbitux = drug.name.includes('Erbitux');
      const isBavencio = drug.name.includes('Bavencio');

      // Filter eligible active distributors based on product authorization and pharmacy link status
      const eligibleDistributors = DISTRIBUTORS_LIST.filter(d => {
        const isLinked = distributorLinks[d.id] === 'Active';
        const isAuth = (productAuths[drug.id] || drug.availableDistributors).includes(d.id);
        return isLinked && isAuth;
      });

      const handleSubmitOrder = (e) => {
        e.preventDefault();
        if (!distributor && !isErbitux) return;

        if (isErbitux) {
          if (!patientName || !patientId) return;
          const newEnrollment = {
            id: `ENR-${Math.floor(100 + Math.random() * 900)}`,
            pharmacy: 'Al-Shifa Community Pharmacy',
            patientName,
            nationalId: patientId,
            hospital: hospitalName || 'General Clinic',
            date: new Date().toISOString().split('T')[0],
            status: 'Approved'
          };
          setPatientEnrollments(prev => [newEnrollment, ...prev]);
        }

        const selectedDistObj = DISTRIBUTORS_LIST.find(d => d.id === distributor) || DISTRIBUTORS_LIST[0];
        const perSkuLimit = skuLimits[drug.name] || 50;
        const totalVal = drug.price * qty + (isExpedited ? 250 : 0);

        // Assign Trigger Logic (Section 2.4 Table)
        let status = 'Confirmed';
        let trigger = null;

        if (qty > perSkuLimit || totalVal > 50000) {
          status = 'Pending Merck Approval';
          trigger = qty > perSkuLimit ? 'Exceeds per-SKU limit' : 'Tier 2 Value Threshold Exceeded';
        } else if (qty > 15 || totalVal > 15000) {
          status = 'Pending Review';
          trigger = 'Quantity anomaly / expensive order';
        }

        const newOrder = {
          id: `ORD-${Math.floor(8000 + Math.random() * 1000)}`,
          pharmacy: 'Al-Shifa Community Pharmacy',
          product: drug.name,
          qty,
          total: totalVal,
          distributor: selectedDistObj.name,
          branch: selectedDistObj.branches[0],
          status,
          trigger,
          date: new Date().toISOString().replace('T', ' ').substring(0, 16),
          ClinicalUrgent: isClinicalUrgent,
          payment: paymentMethod
        };

        onAddOrder(newOrder);
      };

      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-merck max-w-2xl w-full p-6 max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-start mb-4 border-b border-gray-100 pb-3">
              <div>
                <span className="text-xs text-merckPurple font-bold uppercase">{drug.line}</span>
                <h3 className="font-display text-2xl text-black">{drug.name}</h3>
              </div>
              <button onClick={onClose} className="text-black hover:text-merckMagenta text-xl font-bold">&times;</button>
            </div>

            {/* Bavencio Merck Offer Banner (Section 2.4 / 2.8) */}
            {isBavencio && (

    // --- CHAT WITH MEDICAL REP (Section 2.7) ---
    function MedicalRepChat() {
      const [messages, setMessages] = useState([
        { sender: 'rep', text: 'Good day! I am Dr. Tarek El-Kady, your assigned Merck Medical Representative for Greater Cairo. How may I assist your pharmacy today?' }
      ]);
      const [inputText, setInputText] = useState('');

      const handleSend = (e) => {
        e.preventDefault();
        if (!inputText.trim()) return;

        const userMsg = { sender: 'user', text: inputText };
        setMessages(prev => [...prev, userMsg]);
        setInputText('');

        setTimeout(() => {
          let botReply = "Thank you for reaching out. I have logged your query and will follow up with details shortly.";
          if (userMsg.text.toLowerCase().includes('bavencio')) {
            botReply = "Bavencio clinical dosing guides and reimbursement documentation are available upon request. Would you like me to drop off printed copies during my next visit?";
          } else if (userMsg.text.toLowerCase().includes('stock') || userMsg.text.toLowerCase().includes('order')) {
            botReply = "Distributor stock feeds update hourly. For urgent hospital supply escalations, I can assist in verifying cross-branch allocations.";
          }
          setMessages(prev => [...prev, { sender: 'rep', text: botReply }]);
        }, 1000);
      };

      return (
        <div className="max-w-2xl mx-auto border border-gray-200 rounded-merck bg-white flex flex-col h-[500px]">
          <div className="bg-merckPurple text-white p-4 rounded-t-merck flex items-center space-x-3 rtl:space-x-reverse">

          <div className="flex-1 p-4 overflow-y-auto space-y-3 bg-gray-50">

            ))}

          <form onSubmit={handleSend} className="p-3 border-t border-gray-200 bg-white flex space-x-2 rtl:space-x-reverse">

            <button onClick={()=>setActiveTab('salesfeed')} className={`px-4 py-2.5 text-xs font-bold uppercase tracking-wider border-b-2 ${activeTab==='salesfeed'?'border-merckMagenta text-merckMagenta':'border-transparent text-black'}`}>Order Activity Feed</button>
            <button onClick={()=>setActiveTab('territory')} className={`px-4 py-2.5 text-xs font-bold uppercase tracking-wider border-b-2 ${activeTab==='territory'?'border-merckMagenta text-merckMagenta':'border-transparent text-black'}`}>My Territory</button>
            <button onClick={()=>setActiveTab('alerts')} className={`px-4 py-2.5 text-xs font-bold uppercase tracking-wider border-b-2 ${activeTab==='alerts'?'border-merckMagenta text-merckMagenta':'border-transparent text-black'}`}>Area Alerts</button>
            <button onClick={()=>setActiveTab('visits')} className={`px-4 py-2.5 text-xs font-bold uppercase tracking-wider border-b-2 ${activeTab==='visits'?'border-merckMagenta text-merckMagenta':'border-transparent text-black'}`}>Visit Logging (Doctors & Pharmacies)</button>
          </div>

          {/* SECTION 5.1: DASHBOARD (DEFAULT LANDING TAB) */}
          {activeTab === 'dashboard' && (
            <div className="space-y-6">
              <div className="bg-merckPurple text-white p-6 rounded-merck flex justify-between items-center">
                <div>
                  <h3 className="font-display text-2xl font-bold">Rep Territory Overview</h3>
                  <p className="text-xs text-merckTeal font-medium">Representative: Dr. Tarek El-Kady | Greater Cairo Territory</p>
                </div>
                <span className="bg-merckMagenta text-white font-bold text-xs px-3 py-1.5 rounded-full uppercase">
                  Period: September 2026
                </span>
              </div>

              {/* Real Worked Example KPI Cards (Section 5.1) */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div className="border border-gray-200 rounded-merck p-4 bg-white">
                  <span className="text-xs text-black font-semibold block">Target Achievement</span>
                  <span className="font-display text-3xl font-bold text-statusGreen">74%</span>
                  <span className="text-[10px] text-black">Up from 68% last month</span>
                </div>
                <div className="border border-gray-200 rounded-merck p-4 bg-white">
                  <span className="text-xs text-black font-semibold block">Total Territory Order Value</span>
                  <span className="font-display text-3xl font-bold text-merckPurple">EGP 412,000</span>
                </div>
                <div className="border border-gray-200 rounded-merck p-4 bg-white">
                  <span className="text-xs text-black font-semibold block">Active Pharmacies</span>
                  <span className="font-display text-3xl font-bold text-black">18 / 22</span>
                </div>
                <div className="border border-gray-200 rounded-merck p-4 bg-white">
                  <span className="text-xs text-black font-semibold block">At-Risk Pharmacies</span>
                  <span className="font-display text-3xl font-bold text-statusRed">3 Accounts</span>
                </div>
              </div>

              {/* Needs Attention Strip */}
              <div className="border border-gray-200 rounded-merck p-4 bg-white space-y-2 text-xs">
                <h4 className="font-bold text-sm text-merckPurple">Territory Priority Alerts</h4>
                <div className="p-3 bg-statusAmber/10 border-l-4 border-statusAmber rounded-merck font-medium">
                  Al-Shifa Pharmacy — No orders placed in 21 days (previously weekly buyer).
                </div>
                <div className="p-3 bg-statusRed/10 border-l-4 border-statusRed rounded-merck font-medium">
                  Dr. Mostafa Hanafy — Follow-up clinical visit overdue (12 days past scheduled cadence).
                </div>
              </div>
            </div>
          )}

          {/* SECTION 5.2: TARGETS & PERFORMANCE */}
          {activeTab === 'performance' && (
            <div className="space-y-6">
              <h3 className="font-display text-xl text-merckPurple">Target vs. Actual Performance Breakout</h3>
              
              <div className="border border-gray-200 rounded-merck p-5 bg-white space-y-4 text-xs">
                <div className="flex justify-between items-center font-bold text-sm border-b pb-2">
                  <span>Product Line Breakdown</span>
                  <span className="text-statusGreen font-bold">Pacing: 18 of 30 Days Elapsed (60%) — ON TRACK</span>
                </div>

                <div className="space-y-3">
                  <div>
                    <div className="flex justify-between font-bold mb-1">
                      <span>Oncology (Bavencio / Erbitux)</span>
                      <span>EGP 142,000 / EGP 180,000 target (79%)</span>
                    </div>
                    <div className="w-full bg-gray-200 h-2.5 rounded-full overflow-hidden">
                      <div className="bg-merckMagenta h-full w-[79%]"></div>
                    </div>
                  </div>

                  <div>
                    <div className="flex justify-between font-bold mb-1">
                      <span>CVS Metabolism & Endocrinology (Concor / Glucophage)</span>
                      <span>EGP 95,500 / EGP 90,000 target (106%)</span>
                    </div>
                    <div className="w-full bg-gray-200 h-2.5 rounded-full overflow-hidden">
                      <div className="bg-statusGreen h-full w-[100%]"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* SECTION 5.3: ORDER ACTIVITY FEED */}
          {activeTab === 'salesfeed' && (
            <div className="space-y-4">
              <h3 className="font-display text-xl text-merckPurple">Live Territory Order Feed</h3>
              <div className="border border-gray-200 rounded-merck overflow-hidden text-xs">
                <table className="w-full text-left rtl:text-right">
                  <thead className="bg-gray-50 font-bold uppercase text-black border-b">
                    <tr>
                      <th className="p-3">Order ID</th>
                      <th className="p-3">Pharmacy Account</th>
                      <th className="p-3">Product Ordered</th>
                      <th className="p-3">Total Value</th>
                      <th className="p-3">Distributor</th>
                      <th className="p-3">Status</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-100">
                    {orders.map(o => (
                      <tr key={o.id}>
                        <td className="p-3 font-mono font-bold text-merckPurple">{o.id}</td>
                        <td className="p-3 font-bold">{o.pharmacy}</td>
                        <td className="p-3">{o.product} x {o.qty}</td>
                        <td className="p-3 font-bold">EGP {o.total.toLocaleString()}</td>
                        <td className="p-3">{o.distributor}</td>
                        <td className="p-3 font-bold uppercase">{o.status}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* SECTION 5.4: MY TERRITORY */}
          {activeTab === 'territory' && (
            <div className="space-y-4">
              <h3 className="font-display text-xl text-merckPurple">Assigned Territory Pharmacies</h3>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                <div className="border border-gray-200 rounded-merck p-4 bg-white space-y-2">
                  <div className="flex justify-between items-start">
                    <h4 className="font-bold text-sm text-black">Al-Shifa Community Pharmacy</h4>
                    <span className="bg-statusAmber/10 text-statusAmber font-bold px-2 py-0.5 rounded uppercase">Dormant</span>
                  </div>
                  <p>Last Order: 21 days ago</p>
                  <p>Primary Distributor: PharmaOverseas</p>
                </div>
                <div className="border border-gray-200 rounded-merck p-4 bg-white space-y-2">
                  <div className="flex justify-between items-start">
                    <h4 className="font-bold text-sm text-black">Cairo Care Hospital Pharmacy</h4>
                    <span className="bg-statusGreen/10 text-statusGreen font-bold px-2 py-0.5 rounded uppercase">Active</span>
                  </div>
                  <p>Last Order: 2 days ago</p>
                  <p>Primary Distributor: Minapharm</p>
                </div>
              </div>
            </div>
          )}

          {/* SECTION 5.5: AREA ALERTS */}
          {activeTab === 'alerts' && (
            <div className="space-y-4 text-xs">
              <h3 className="font-display text-xl text-merckPurple">Territory Escalations & Alerts</h3>
              <div className="p-4 border-l-4 border-statusRed bg-statusRed/10 rounded-merck">
                <span className="font-bold text-statusRed block text-sm">Stock-Out Warning at Ibn Sina Giza Hub</span>
                <span>Bavencio 200mg stock depleted at Ibn Sina. Recommend routing Cairo Care Hospital orders via PharmaOverseas temporarily.</span>
              </div>
            </div>
          )}

          {/* SECTION 5.6: VISIT LOGGING */}
          {activeTab === 'visits' && (
            <div className="space-y-6">
              <h3 className="font-display text-xl text-merckPurple">Doctor & Pharmacy Visit Engagement Log</h3>

              <form onSubmit={handleLogVisit} className="border border-gray-200 rounded-merck p-5 bg-white space-y-3 max-w-xl text-xs">
                <h4 className="font-bold text-sm text-black">Log New Visit Activity</h4>
                <div>
                  <label className="block font-bold uppercase mb-1">Physician / Contact Name</label>
                  <input 
                    type="text" 
                    value={newDocName} 
                    onChange={e=>setNewDocName(e.target.value)} 
                    placeholder="e.g. Dr. Mona El-Sayed" 
                    className="w-full border border-gray-300 rounded-merck p-2" 
                    required 
                  />
                </div>
                <div>
                  <label className="block font-bold uppercase mb-1">Discussion Topic / Outcome</label>
                  <textarea 
                    value={newDocTopic} 
                    onChange={e=>setNewDocTopic(e.target.value)} 
                    placeholder="Details of discussion or medical literature drop..." 
                    className="w-full border border-gray-300 rounded-merck p-2" 
                    rows="2" 
                  />
                </div>
                <button type="submit" className="bg-merckMagenta text-white font-bold px-4 py-2 rounded-merck uppercase">
                  Save Visit Entry
                </button>
              </form>

              <div className="border border-gray-200 rounded-merck p-5 bg-white space-y-3 text-xs">
                <h4 className="font-bold text-sm text-black">Historical Visit Log</h4>
                {doctorVisits.map(v => (
                  <div key={v.id} className="p-3 bg-gray-50 rounded-merck flex justify-between items-center">
                    <div>
                      <span className="font-bold text-merckPurple">{v.doctor} ({v.specialty})</span>
                      <p>{v.hospital}</p>
                      <p className="text-black italic">{v.topic}</p>
                    </div>
                    <span className="font-mono text-[11px] text-black">{v.date}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    // Render App Component into Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
